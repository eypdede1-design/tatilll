<style>
  :root {
    --sun: #FFD93D;
    --ocean: #0096C7;
    --sand: #FFDAB9;
    --coral: #FF6B6B;
    --palm: #2D6A4F;
    --sky: #ADE8F4;
    --white: #FFFEF7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(180deg, #87CEEB 0%, #ADE8F4 40%, #0096C7 70%, #023E8A 100%);
    overflow-x: hidden;
    position: relative;
  }

  .sun {
    position: fixed;
    top: -60px;
    right: 80px;
    width: 160px;
    height: 160px;
    background: radial-gradient(circle, #fff176, #FFD93D, #FFB300);
    border-radius: 50%;
    box-shadow: 0 0 60px 30px rgba(255,217,61,0.4), 0 0 120px 60px rgba(255,183,0,0.2);
    animation: sunPulse 4s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes sunPulse {
    0%, 100% { box-shadow: 0 0 60px 30px rgba(255,217,61,0.4), 0 0 120px 60px rgba(255,183,0,0.2); }
    50% { box-shadow: 0 0 80px 50px rgba(255,217,61,0.6), 0 0 150px 80px rgba(255,183,0,0.3); }
  }

  .cloud {
    position: fixed;
    background: white;
    border-radius: 50px;
    opacity: 0.85;
    z-index: 0;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud1 { width: 120px; height: 40px; top: 60px; left: -130px; animation: cloudMove 25s linear infinite; }
  .cloud1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
  .cloud1::after { width: 45px; height: 45px; top: -20px; left: 55px; }
  .cloud2 { width: 90px; height: 30px; top: 110px; left: -100px; animation: cloudMove 35s linear infinite 10s; opacity: 0.6; }
  .cloud2::before { width: 45px; height: 45px; top: -22px; left: 10px; }
  .cloud2::after { width: 35px; height: 35px; top: -15px; left: 40px; }

  @keyframes cloudMove {
    from { left: -150px; }
    to { left: 110vw; }
  }

  .waves {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 0;
  }
  .wave {
    position: absolute;
    bottom: 0;
    width: 200%;
    height: 80px;
    background: rgba(255,255,255,0.15);
    border-radius: 50% 50% 0 0;
  }
  .wave1 { animation: wave 6s ease-in-out infinite; }
  .wave2 { height: 60px; background: rgba(255,255,255,0.1); animation: wave 8s ease-in-out infinite reverse 1s; }
  .wave3 { height: 40px; background: rgba(173,232,244,0.2); animation: wave 10s ease-in-out infinite 2s; }
  @keyframes wave {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-25%); }
  }

  .palm { position: fixed; bottom: 40px; z-index: 1; }
  .palm-left { left: -10px; transform: rotate(-8deg); }
  .palm-right { right: -10px; transform: rotate(8deg) scaleX(-1); }
  .palm svg { width: 120px; height: 200px; }

  .container {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .title-box {
    text-align: center;
    margin-bottom: 30px;
  }

  .emoji-row {
    font-size: 2.5rem;
    margin-bottom: 8px;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: var(--white);
    text-shadow: 3px 3px 0 var(--coral), 6px 6px 0 rgba(0,0,0,0.2);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: rgba(255,255,255,0.9);
    font-weight: 700;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
  }

  .countdown {
    display: flex;
    gap: clamp(10px, 3vw, 24px);
    flex-wrap: wrap;
    justify-content: center;
    margin: 20px 0;
  }

  .time-block {
    background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(255,250,230,0.9));
    border-radius: 20px;
    padding: clamp(16px, 4vw, 28px) clamp(14px, 3vw, 24px);
    text-align: center;
    min-width: clamp(70px, 18vw, 110px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2), 0 2px 0 rgba(255,255,255,0.8) inset;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s;
  }

  .time-block:hover { transform: translateY(-5px) scale(1.05); }

  .time-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--coral), var(--sun), var(--ocean));
  }

  .time-number {
    font-family: 'Pacifico', cursive;
    font-size: clamp(2rem, 7vw, 3.5rem);
    color: var(--ocean);
    line-height: 1;
    text-shadow: 2px 2px 0 rgba(0,150,199,0.2);
  }

  .time-label {
    font-size: clamp(0.65rem, 2vw, 0.85rem);
    font-weight: 900;
    color: var(--coral);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 6px;
  }

  .separator {
    font-family: 'Pacifico', cursive;
    font-size: 2.5rem;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    align-self: center;
    margin-bottom: 20px;
    animation: blink 1s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .info-box {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 20px;
    padding: 16px 32px;
    text-align: center;
    color: white;
    font-weight: 700;
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    margin-top: 10px;
    max-width: 400px;
    line-height: 1.8;
  }

  .info-box span {
    color: var(--sun);
    font-family: 'Pacifico', cursive;
  }

  .floaties {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }

  .floaty {
    position: absolute;
    font-size: 1.8rem;
    animation: floatUp linear infinite;
    opacity: 0.7;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
  }

  .done-message {
    display: none;
    text-align: center;
  }
  .done-message h2 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(2rem, 6vw, 4rem);
    color: var(--sun);
    text-shadow: 3px 3px 0 var(--coral);
    animation: bounce 1s infinite;
  }
</style>

<script>
  const target = new Date('2026-07-25T07:00:00');

  function pad(n) { return String(n).padStart(2, '0'); }

  function update() {
    const now = new Date();
    const diff = target - now;

    if (diff <= 0) {
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('doneMsg').style.display = 'block';
      return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    document.getElementById('days').textContent = pad(days);
    document.getElementById('hours').textContent = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }

  update();
  setInterval(update, 1000);

  const emojis = ['🌊','🐚','⭐','🐠','🦀','🌺','🌸','💦','🐬','🦋','🌻','🏄','🌅','🍹'];
  const floatContainer = document.getElementById('floaties');

  function spawnFloaty() {
    const el = document.createElement('div');
    el.className = 'floaty';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (8 + Math.random() * 12) + 's';
    el.style.animationDelay = (Math.random() * 3) + 's';
    el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
    floatContainer.appendChild(el);
    setTimeout(() => el.remove(), 22000);
  }

  for (let i = 0; i < 10; i++) setTimeout(spawnFloaty, i * 800);
  setInterval(spawnFloaty, 2500);
</script>
